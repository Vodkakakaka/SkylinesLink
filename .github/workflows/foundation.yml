name: Foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-foundation:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      RestoreLockedMode: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore SkylinesLink.slnx --locked-mode
      - name: Build foundation
        run: pnpm build
      - name: Test foundation
        run: pnpm test
      - name: Test SDK dependency alignment
        run: node --test tools/build/toolchain.test.mjs
      - name: Test package boundaries
        run: pnpm test:core
      - name: Build NativeAOT desktop
        run: pnpm build:aot
      # The report records elevation. Elevated CI does not establish
      # ordinary-user or clean-machine qualification.
      - name: Verify NativeAOT desktop
        run: pnpm test:desktop:aot
      - name: Check generated source is unchanged
        run: git diff --exit-code
      - name: Package exact source preview
        run: pnpm build:source-preview
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-preview
          path: artifacts/source-preview/*
          if-no-files-found: error
      - name: Upload NativeAOT validation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nativeaot-validation
          path: artifacts/nativeaot/validation.json
          if-no-files-found: error
